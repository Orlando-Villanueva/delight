appId: com.orlandovillanueva.delight.preview
name: Staging core reading loop
tags:
  - android
  - staging
---
- launchApp:
    clearState: true
- assertVisible:
    id: login-email-input
- tapOn:
    id: login-email-input
- inputText: ${MAESTRO_EMAIL}
- tapOn:
    id: login-password-input
- inputText: ${MAESTRO_PASSWORD}
- tapOn:
    id: login-submit-button
- assertVisible:
    id: home-dashboard
- tapOn:
    id: log-tab-button
- assertVisible:
    id: reading-log-form
- tapOn:
    id: reading-log-today
- tapOn:
    id: reading-log-book-picker
- assertVisible:
    id: book-picker-modal
- tapOn: Show New Testament books
- tapOn: ${MAESTRO_BOOK}
- tapOn:
    id: reading-log-start-chapter
- inputText: ${MAESTRO_START_CHAPTER}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: reading-log-add-note
    direction: DOWN
- tapOn:
    id: reading-log-add-note
- tapOn:
    id: reading-log-notes
- inputText: ${MAESTRO_RUN_ID}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: reading-log-submit
    direction: DOWN
- tapOn:
    id: reading-log-submit
- assertVisible:
    id: reading-log-success
- tapOn:
    id: home-tab-button
- assertVisible:
    id: home-recorded-status
- tapOn:
    id: history-tab-button
- assertVisible:
    id: reading-history
- assertVisible: ${MAESTRO_RUN_ID}
